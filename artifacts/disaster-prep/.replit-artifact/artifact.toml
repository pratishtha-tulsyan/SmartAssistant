kind = "web"
previewPath = "/"
title = "Disaster Preparedness & Response Education System"
version = "1.0.0"
id = "artifacts/disaster-prep"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21759

[services.development]
run = "pnpm --filter @workspace/disaster-prep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/disaster-prep", "run", "build" ]
publicDir = "artifacts/disaster-prep/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21759"
BASE_PATH = "/"
